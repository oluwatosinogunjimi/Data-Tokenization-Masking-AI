name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Dependency-free checks first.
      - run: node tests/run.js --gaps
      # Optional: add a PUBLIC_SAFETY_DENYLIST repository secret (one term per line) to extend this check.
      - run: node tests/public-safety.js
        env:
          PUBLIC_SAFETY_DENYLIST: ${{ secrets.PUBLIC_SAFETY_DENYLIST }}
      # The interface, end to end in headless Chromium.
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui.js
